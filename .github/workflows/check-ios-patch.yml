name: Check iOS navigation patch
on:
  push:
    paths:
      - '.github/workflows/check-ios-patch.yml'
      - 'GeckoStandalone/ChatGPTNavigationRecoveryHook.m'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify iOS Objective-C source
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 -fobjc-arc -fblocks -fsyntax-only -x objective-c GeckoStandalone/ChatGPTNavigationRecoveryHook.m
