name: Verify free runner
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/runner-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Runner is available"
  macos-check:
    runs-on: macos-15
    steps:
      - run: xcrun --sdk iphoneos --show-sdk-path
